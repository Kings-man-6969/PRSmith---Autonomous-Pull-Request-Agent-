name: CI

on:
  push:
    branches:
      - main
      - master
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Typecheck, Audit & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies from lockfile
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install -e ".[dev]"

      - name: Dependency Security Audit
        run: |
          pip-audit --desc on

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy backend worker

      - name: Run Test Suite with Coverage Gate
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SYNC_DATABASE_URL: sqlite:///./test.db
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-32-chars-minimum-length-ok
          GITHUB_TOKEN_ENCRYPTION_KEY: uX7vK3zY1u_r8o2WqH0pJ5mN4sB9cE6vL1aD3fG5hJ8=
        run: |
          pytest tests/ -v --cov=backend --cov=worker --cov-report=term-missing --cov-fail-under=60

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend application
        run: npm run build
