[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prsmith"
version = "0.1.0"
description = "Autonomous Pull Request Review Agent"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.1",
    "celery[redis]>=5.4.0",
    "redis>=5.0.4",
    "httpx>=0.27.0",
    "PyGithub>=2.3.0",
    "gitpython>=3.1.43",
    "unidiff>=0.7.5",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=42.0.0",
    "PyJWT>=2.8.0",
    "openai>=1.35.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    "tiktoken>=0.7.0",
    "docker>=7.1.0",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "python-multipart>=0.0.9",
    "flower>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "black>=24.4.2",
    "types-redis>=4.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["backend", "worker"]
omit = ["tests/*", "*/__init__.py"]

[tool.setuptools]
packages = ["backend", "worker"]
